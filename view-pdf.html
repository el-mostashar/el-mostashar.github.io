<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عرض المذكرة | محمية</title>
    <!-- استدعاء مكتبة PDF.js من الـ CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <style>
        body {
            background-color: #333; /* لون خلفية غامق يريح العين */
            margin: 0;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* منع تحديد النص */
            user-select: none; 
            -webkit-user-select: none;
        }

        #pdf-render-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* تصميم الـ Canvas (الصفحات) */
        canvas {
            max-width: 100%;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            background-color: white;
            border-radius: 5px;
        }

        /* شريط التحميل */
        #loading-msg {
            color: white;
            font-family: Tahoma, sans-serif;
            font-size: 20px;
            margin-top: 50px;
        }
    </style>
</head>
<body oncontextmenu="return false;"> <!-- قفل الكليك يمين على الصفحة كلها -->

    <div id="loading-msg">جاري تجهيز المذكرة... برجاء الانتظار ⏳</div>
    
    <div id="pdf-render-container">
        <!-- الصفحات هتترسم هنا أوتوماتيك -->
    </div>

    <script>
        // قفل اختصارات الكيبورد (الطباعة والحفظ)
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && (e.key === 'p' || e.key === 's' || e.key === 'P' || e.key === 'S')) {
                e.preventDefault();
                alert("عفواً، غير مسموح بطباعة أو حفظ هذه المذكرة.");
            }
        });

        // إعدادات مكتبة PDF.js
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

        // سحب الرابط من الـ URL اللي جاي من صفحة التفعيل
        const urlParams = new URLSearchParams(window.location.search);
        const pdfUrl = urlParams.get('file');

        if (!pdfUrl) {
            document.getElementById('loading-msg').innerText = "حدث خطأ: لم يتم العثور على رابط المذكرة.";
        } else {
            // تحميل المذكرة
            const loadingTask = pdfjsLib.getDocument(pdfUrl);
            
            loadingTask.promise.then(pdf => {
                document.getElementById('loading-msg').style.display = 'none'; // إخفاء رسالة التحميل
                const container = document.getElementById('pdf-render-container');

                // حلقة (Loop) لرسم كل الصفحات ورا بعض
                for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                    pdf.getPage(pageNum).then(page => {
                        const scale = 1.5; // درجة وضوح الصفحة (ممكن تزودها لـ 2 لو عايز جودة أعلى)
                        const viewport = page.getViewport({ scale: scale });

                        // إنشاء Canvas جديد لكل صفحة
                        const canvas = document.createElement('canvas');
                        const context = canvas.getContext('2d');
                        canvas.height = viewport.height;
                        canvas.width = viewport.width;

                        // رسم الصفحة
                        const renderContext = {
                            canvasContext: context,
                            viewport: viewport
                        };
                        page.render(renderContext);

                        // إضافة الصفحة في الموقع
                        container.appendChild(canvas);
                    });
                }
            }).catch(error => {
                console.error(error);
                document.getElementById('loading-msg').innerText = "حدث خطأ أثناء فتح المذكرة. تأكد من الرابط أو الاتصال بالإنترنت.";
            });
        }
    </script>
</body>
</html>

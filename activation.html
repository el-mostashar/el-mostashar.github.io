<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفعيل المذكرة | المنصة التعليمية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .box {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h2 {
            color: #1e293b;
            margin-bottom: 10px;
        }

        p {
            color: #64748b;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        input {
            width: 100%;
            padding: 15px;
            font-size: 20px;
            text-align: center;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 3px;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: #4f46e5;
        }

        button {
            width: 100%;
            padding: 15px;
            background-color: #4f46e5;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #4338ca;
        }

        #errorMsg {
            color: #ef4444;
            margin-top: 15px;
            font-weight: bold;
            display: none;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="box">
        <i class="fa-solid fa-shield-halved" style="font-size: 50px; color: #4f46e5; margin-bottom: 15px;"></i>
        <h2>مذكرة محمية</h2>
        <p>يرجى إدخال كود التفعيل لفتح هذه المذكرة.<br><small style="color:#ef4444;">ملاحظة: يجب أن تتطابق فئة الكود مع
                سعر المذكرة.</small></p>

        <input type="text" id="codeInput" placeholder="اكتب الكود هنا" maxlength="6">
        <button id="verifyBtn">تحقق وافتح المذكرة</button>
        <div id="errorMsg"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        // ضفنا هنا خاصية جلب البيانات بالمستند (getDoc)
        import { getFirestore, collection, getDocs, query, where, updateDoc, doc, serverTimestamp, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCQMG66ctR_2o_b_38EReG7_ALuhp3OrJE",
            authDomain: "college-platform-1.firebaseapp.com",
            projectId: "college-platform-1"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const pdfId = urlParams.get('id');
        // فحص الـ ID فقط بدون الرابط
        if (!pdfId) { window.location.href = "index.html"; }

        if (localStorage.getItem('access_' + pdfId) === 'true') {
            document.body.innerHTML = '<h2 style="text-align:center; margin-top:50px;">جاري فتح المذكرة...</h2>';

            // التوجيه للعارض المحمي باستخدام الـ ID فقط
            window.location.href = "secure-viewer.html?id=" + pdfId;
        }
        const btn = document.getElementById('verifyBtn');
        const errorMsg = document.getElementById('errorMsg');

        btn.addEventListener('click', async () => {
            const enteredCode = document.getElementById('codeInput').value.trim().toUpperCase();
            if (enteredCode.length === 0) return;

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري التحقق...';
            errorMsg.style.display = 'none';

            try {
                // 1. جلب بيانات المذكرة لمعرفة سعرها الحقيقي من الداتا بيز
                const pdfQuery = query(collection(db, "pdfs"), where("id", "==", pdfId));
                const pdfSnapshot = await getDocs(pdfQuery);

                if (pdfSnapshot.empty) {
                    throw new Error("حدث خطأ: المذكرة غير موجودة بالنظام.");
                }
                const pdfData = pdfSnapshot.docs[0].data();
                const requiredPrice = pdfData.price || 0; // سعر المذكرة

                // 2. التحقق من الكود اللي الطالب دخله
                const q = query(collection(db, "codes"), where("code", "==", enteredCode));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    throw new Error("الكود غير صحيح! تأكد من الحروف والأرقام.");
                }

                const codeDoc = querySnapshot.docs[0];
                const codeData = codeDoc.data();
                const codePrice = codeData.price || 0; // سعر الكود

                // 3. التحقق من الاستخدام
                if (codeData.isUsed === true) {
                    throw new Error("هذا الكود تم استخدامه من قبل!");
                }

                // 4. حائط الصد الجديد: التحقق من تطابق السعر
                if (codePrice !== requiredPrice) {
                    throw new Error(`عفواً، هذا الكود فئة (${codePrice} جنيه) ولا يمكن استخدامه لمذكرة بسعر (${requiredPrice} جنيه).`);
                }

                // الكود سليم وسعره مطابق -> توثيق الاستخدام وفتح المذكرة
                await updateDoc(doc(db, "codes", codeDoc.id), {
                    isUsed: true,
                    usedForPdf: pdfId,
                    usedAt: serverTimestamp()
                });

                localStorage.setItem('access_' + pdfId, 'true');
                btn.style.backgroundColor = "#10b981";
                btn.innerHTML = '✅ كود صحيح! جاري الفتح...';

                setTimeout(() => {
                    window.location.href = "secure-viewer.html?id=" + pdfId;
                }, 1000);
            } catch (error) {
                errorMsg.innerText = error.message;
                errorMsg.style.display = 'block';
                btn.disabled = false;
                btn.innerText = 'تحقق وافتح المذكرة';
            }
        });
    </script>
</body>

</html>
